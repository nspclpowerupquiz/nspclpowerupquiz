<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NSPCL Power Up SSC-C&M Quiz | Gallery</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================================
   BODY
========================================= */

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;

    background:
        linear-gradient(135deg, #001f3f, #0074a8);

    color: white;
}


/* =========================================
   NAVIGATION
========================================= */

nav {
    background: red;
    color: white;
    padding: 20px;
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: 600;
}

nav a:hover {
    text-decoration: underline;
}


/* =========================================
   HEADER
========================================= */

.gallery-header {
    text-align: center;
    padding: 40px 20px;

    background:
        rgba(255,255,255,0.1);

    backdrop-filter: blur(10px);
}

.gallery-header h1 {
    font-size: 42px;
    margin: 10px;
}

.gallery-header p {
    font-size: 18px;
    color: #d9f7ff;
}


/* =========================================
   STATISTICS
========================================= */

.stats-container {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

    gap: 25px;

    padding: 35px;
}

.stat-card {
    background:
        rgba(255,255,255,.15);

    border-radius: 20px;

    padding: 25px;

    text-align: center;

    box-shadow:
        0 10px 25px #0005;

    transition: .4s;
}

.stat-card:hover {
    transform: translateY(-10px);
}

.stat-card h2 {
    font-size: 42px;

    color: #00ffff;

    margin: 5px;
}


/* =========================================
   SECTION TITLE
========================================= */

.section-title {
    text-align: center;

    font-size: 30px;

    margin-top: 30px;
}


/* =========================================
   WINNERS
========================================= */

.winner-container {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));

    gap: 20px;

    padding: 25px;
}

.winner-card {
    background: white;

    color: #123;

    padding: 20px;

    border-radius: 18px;

    box-shadow:
        0 8px 20px #0005;
}

.winner-card h3 {
    margin-top: 0;

    color: #0066cc;
}


/* =========================================
   GALLERY
========================================= */

.gallery-container {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));

    gap: 25px;

    padding: 35px;
}

.gallery-card {
    background: white;

    color: #222;

    border-radius: 20px;

    overflow: hidden;

    cursor: pointer;

    transition: .4s;

    box-shadow:
        0 8px 20px rgba(0,0,0,.25);
}

.gallery-card:hover {
    transform:
        translateY(-10px)
        scale(1.03);
}

.gallery-card img {
    width: 100%;

    height: 240px;

    object-fit: cover;

    display: block;

    background: #eeeeee;
}

.gallery-info {
    padding: 15px;
}

.gallery-info h3 {
    margin: 0 0 5px 0;
}

.gallery-info p {
    margin: 0;

    color: #555;
}


/* =========================================
   IMAGE ERROR
========================================= */

.image-error {
    height: 240px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #eeeeee;

    color: #777;

    text-align: center;

    font-weight: 600;
}


/* =========================================
   POPUP
========================================= */

.popup {
    display: none;

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background:
        rgba(0,0,0,.85);

    justify-content: center;

    align-items: center;

    z-index: 9999;

    cursor: pointer;
}

.popup img {
    max-width: 90%;

    max-height: 80%;

    border-radius: 20px;

    box-shadow:
        0 10px 40px rgba(0,0,0,.7);
}

.close {
    position: absolute;

    right: 40px;

    top: 20px;

    font-size: 45px;

    cursor: pointer;

    color: white;

    z-index: 10000;
}


/* =========================================
   LOADING
========================================= */

.loading {
    text-align: center;

    padding: 40px;

    font-size: 20px;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .gallery-header h1 {
        font-size: 30px;
    }

    .gallery-header p {
        font-size: 15px;
    }

    .stats-container {
        padding: 20px;
    }

    .gallery-container {
        padding: 20px;
        grid-template-columns: 1fr;
    }

    nav {
        padding: 15px;
        gap: 15px;
        justify-content: center;
    }

}

</style>

</head>


<body>


<!-- =========================================
     NAVIGATION
========================================= -->

<nav>

    <a href="index.html">
        🏠 Home
    </a>

    <a href="quiz.html">
        ⚡ Start Quiz
    </a>

    <a href="leaderboard.html">
        🏆 Leaderboard
    </a>

    <a href="analytics.html">
        📊 Analytics
    </a>

    <a href="gallery.html" class="active">
        📸 Gallery
    </a>

</nav>


<!-- =========================================
     HEADER
========================================= -->

<div class="gallery-header">

    <h1>
        ⚡ NSPCL Power-Up Quiz Gallery
    </h1>

    <p>
        Celebrating Learning • Participation • Excellence
    </p>

</div>


<!-- =========================================
     LIVE STATS
========================================= -->

<div class="stats-container">


    <div class="stat-card">

        <h2 id="totalUsers">
            0
        </h2>

        <p>
            Total Participants
        </p>

    </div>


    <div class="stat-card">

        <h2 id="highestScore">
            0
        </h2>

        <p>
            Highest Score
        </p>

    </div>


    <div class="stat-card">

        <h2 id="averageScore">
            0%
        </h2>

        <p>
            Average Performance
        </p>

    </div>


    <div class="stat-card">

        <h2 id="topWinner">
            ---
        </h2>

        <p>
            Top Performer
        </p>

    </div>

</div>


<!-- =========================================
     QUIZ CHAMPIONS
========================================= -->

<h2 class="section-title">
    🏆 Quiz Champions
</h2>


<div id="winnerList"
     class="winner-container">

</div>


<!-- =========================================
     GALLERY
========================================= -->

<h2 class="section-title">
    📸 NSPCL Moments
</h2>


<div id="galleryContainer"
     class="gallery-container">

    <div class="loading">
        Loading Gallery...
    </div>

</div>


<!-- =========================================
     IMAGE POPUP
========================================= -->

<div id="popup"
     class="popup"
     onclick="closePopup()">

    <span class="close">
        ×
    </span>

    <img id="popupImage"
         alt="Gallery Image">

</div>


<script>


// =====================================================
// GOOGLE APPS SCRIPT URL
// =====================================================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbziOrV0Tit-jAwCXLZTLJovnnpIh1zTLpZVOOmhtjXyigCj6uxFxY-UYfK6_gn1xXW-yA/exec";


// =====================================================
// PAGE LOAD
// =====================================================

window.onload = function() {

    loadStats();

    loadGallery();

};


// =====================================================
// LOAD STATISTICS
// =====================================================

function loadStats() {

    fetch(
        SCRIPT_URL + "?action=stats"
    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Stats HTTP error: " +
                response.status
            );

        }

        return response.json();

    })

    .then(data => {

        console.log(
            "Stats Data:",
            data
        );


        document.getElementById(
            "totalUsers"
        ).innerHTML =
            data.total || 0;


        document.getElementById(
            "highestScore"
        ).innerHTML =
            data.highest || 0;


        document.getElementById(
            "averageScore"
        ).innerHTML =
            (data.average || 0) + "%";


        document.getElementById(
            "topWinner"
        ).innerHTML =
            data.name || "---";


        let html = "";


        if (
            Array.isArray(data.top)
        ) {

            data.top.forEach(
                function(item, index) {

                    html += `

                        <div class="winner-card">

                            <h3>
                                🥇
                                ${index + 1}.
                                ${escapeHTML(item.name || "")}
                            </h3>

                            <p>
                                Employee ID :
                                ${escapeHTML(item.id || "")}
                            </p>

                            <p>
                                Score :
                                ${item.score || 0}/${item.total || 0}
                            </p>

                        </div>

                    `;

                }
            );

        }


        document.getElementById(
            "winnerList"
        ).innerHTML = html;

    })

    .catch(error => {

        console.error(
            "Stats Error:",
            error
        );

    });

}


// =====================================================
// LOAD GALLERY
// =====================================================

function loadGallery() {

    const gallery =
        document.getElementById(
            "galleryContainer"
        );


    if (!gallery) {

        console.error(
            "galleryContainer not found"
        );

        return;

    }


    fetch(
        SCRIPT_URL + "?action=gallery"
    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Gallery HTTP error: " +
                response.status
            );

        }

        return response.json();

    })

    .then(data => {

        console.log(
            "Gallery Data:",
            data
        );


        if (
            !Array.isArray(data) ||
            data.length === 0
        ) {

            gallery.innerHTML = `

                <div class="loading">

                    📸 No Gallery Images Available

                </div>

            `;

            return;

        }


        gallery.innerHTML = "";


        data.forEach(
            function(item) {


                // =====================================
                // GET IMAGE NAME / URL
                // =====================================

                let image =
                    String(
                        item.image || ""
                    ).trim();


                // =====================================
                // FIX IMAGE PATH
                // =====================================

                let imageURL = "";


                if (!image) {

                    imageURL = "";

                }


                // Full external URL
                else if (
                    image.startsWith("http://") ||
                    image.startsWith("https://")
                ) {

                    imageURL = image;

                }


                // Already has images/ path
                else if (
                    image.startsWith("images/")
                ) {

                    imageURL = image;

                }


                // Just filename
                else {

                    imageURL =
                        "images/" + image;

                }


                console.log(
                    "Gallery Image:",
                    imageURL
                );


                // =====================================
                // CREATE CARD
                // =====================================

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "gallery-card";


                // =====================================
                // IMAGE
                // =====================================

                if (imageURL) {

                    const img =
                        document.createElement(
                            "img"
                        );


                    img.src =
                        imageURL;


                    img.alt =
                        item.title ||
                        "NSPCL Gallery Image";


                    img.loading =
                        "lazy";


                    // -----------------------------
                    // IMAGE CLICK
                    // -----------------------------

                    img.onclick =
                        function(event) {

                            event.stopPropagation();

                            openPopup(
                                imageURL
                            );

                        };


                    // -----------------------------
                    // IMAGE ERROR
                    // -----------------------------

                    img.onerror =
                        function() {

                            console.error(
                                "IMAGE FAILED:",
                                imageURL
                            );


                            this.style.display =
                                "none";


                            const errorBox =
                                document.createElement(
                                    "div"
                                );


                            errorBox.className =
                                "image-error";


                            errorBox.innerHTML =
                                "⚠️ Image could not be loaded";


                            card.insertBefore(
                                errorBox,
                                card.firstChild
                            );

                        };


                    card.appendChild(
                        img
                    );

                }


                // =====================================
                // GALLERY INFORMATION
                // =====================================

                const info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "gallery-info";


                info.innerHTML = `

                    <h3>
                        ${escapeHTML(
                            item.title ||
                            "NSPCL Power-Up Quiz"
                        )}
                    </h3>

                    <p>
                        ${escapeHTML(
                            item.category ||
                            ""
                        )}
                    </p>

                `;


                card.appendChild(
                    info
                );


                gallery.appendChild(
                    card
                );

            }
        );

    })

    .catch(error => {

        console.error(
            "Gallery Error:",
            error
        );


        gallery.innerHTML = `

            <div class="loading">

                ❌ Unable to load gallery

            </div>

        `;

    });

}


// =====================================================
// OPEN IMAGE POPUP
// =====================================================

function openPopup(imageURL) {

    if (!imageURL) {

        return;

    }


    document.getElementById(
        "popupImage"
    ).src = imageURL;


    document.getElementById(
        "popup"
    ).style.display = "flex";

}


// =====================================================
// CLOSE POPUP
// =====================================================

function closePopup() {

    document.getElementById(
        "popup"
    ).style.display = "none";

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>


</body>

</html>
